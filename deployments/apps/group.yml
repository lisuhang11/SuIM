apiVersion: apps/v1
kind: Deployment
metadata:
  name: group
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: group
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: suim
      app.kubernetes.io/component: group
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suim
        app.kubernetes.io/component: group
    spec:
      containers:
        - name: group
          image: suim/group:dev
          imagePullPolicy: IfNotPresent
          args: ["-c", "services/group/etc/group.yaml"]
          env:
            - name: CONFIG_PATH
              value: /config
            - name: SUIMENV_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: suim-secret, key: mysql-password } }
            - name: SUIMENV_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: suim-secret, key: redis-password } }
          ports:
            - { name: grpc, containerPort: 8083 }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: suim-config }
---
apiVersion: v1
kind: Service
metadata:
  name: group
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: group
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: group
  ports:
    - { name: grpc, port: 8083, targetPort: grpc }
