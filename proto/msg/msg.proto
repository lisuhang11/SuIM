syntax = "proto3";

package msg;

option go_package = "github.com/lisuhang11/SuIM/proto/msg;msgpb";

// MsgService accepts messages and reads history. msggateway calls it and keeps the websocket.
service MsgService {
  rpc SendMsg(SendMsgReq) returns (SendMsgResp);
  rpc GetMaxSeq(GetMaxSeqReq) returns (GetMaxSeqResp);
  rpc PullMessageBySeqs(PullMessageBySeqsReq) returns (PushMessages);
  rpc GetSeqMessage(GetSeqMessageReq) returns (PushMessages);
  rpc GetConversationsHasReadAndMaxSeq(GetConversationsHasReadAndMaxSeqReq) returns (GetConversationsHasReadAndMaxSeqResp);
  rpc GetLastMessage(GetLastMessageReq) returns (GetLastMessageResp);
  // MarkMsgsAsRead marks the given sequences and notifies the peer.
  rpc MarkMsgsAsRead(MarkMsgsAsReadReq) returns (MarkMsgsAsReadResp);
  // MarkConversationAsRead advances one user's read cursor to has_read_seq.
  rpc MarkConversationAsRead(MarkConversationAsReadReq) returns (MarkConversationAsReadResp);
  // SetConversationHasReadSeq stores a read cursor without marking individual messages.
  rpc SetConversationHasReadSeq(SetConversationHasReadSeqReq) returns (SetConversationHasReadSeqResp);
  // GetConversationMaxSeq reads the conversation's latest sequence. It does not check membership.
  rpc GetConversationMaxSeq(GetConversationMaxSeqReq) returns (GetConversationMaxSeqResp);
  // SetUserConversationMaxSeq writes one user's visible ceiling. Zero clears it.
  rpc SetUserConversationMaxSeq(SetUserConversationMaxSeqReq) returns (SetUserConversationMaxSeqResp);
  // SetUserConversationMinSeq writes one user's visible floor. Zero clears it.
  rpc SetUserConversationMinSeq(SetUserConversationMinSeqReq) returns (SetUserConversationMinSeqResp);
}

// OfflinePushInfo is the notification payload on MsgData field 20.
message OfflinePushInfo {
  string title = 1;
  string desc = 2;
  string ex = 3;
  string ios_push_sound = 4;
  bool ios_badge_count = 5;
  string signal_info = 6;
}

// MsgData is one chat message on the transfer queue.
message MsgData {
  string send_id = 1;
  string recv_id = 2;
  string group_id = 3;
  string client_msg_id = 4;
  string server_msg_id = 5;
  int32 sender_platform_id = 6;
  string sender_nickname = 7;
  string sender_face_url = 8;
  int32 session_type = 9;
  int32 msg_from = 10;
  int32 content_type = 11;
  bytes content = 12;
  int64 seq = 14;
  int64 send_time = 15;
  int64 create_time = 16;
  int32 status = 17;
  bool is_read = 18;
  map<string, bool> options = 19;
  OfflinePushInfo offline_push_info = 20;
  repeated string at_user_id_list = 21;
  string attached_info = 22;
  string ex = 23;
}

// TipsComm is the protobuf body of a notification message.
message TipsComm {
  bytes detail = 1;
  string default_tips = 2;
  string json_detail = 3;
}

// MsgDataToMySQL is the toMysql payload. LastSeq is the conversation max before this batch.
message MsgDataToMySQL {
  string conversation_id = 1;
  repeated MsgData msg_data = 2;
  int64 last_seq = 3;
}

// PushMsgData is the toPush payload.
message PushMsgData {
  MsgData msg_data = 1;
  string conversation_id = 2;
}

// PullMsgs is one conversation page inside a websocket push or pull response.
message PullMsgs {
  repeated MsgData msgs = 1;
  bool is_end = 2;
  int64 end_seq = 3;
  int64 max_seq = 4;
}

// PushMessages is the body of websocket push, pull, and seq-list responses.
message PushMessages {
  map<string, PullMsgs> msgs = 1;
  map<string, PullMsgs> notification_msgs = 2;
}

message SendMsgReq {
  MsgData msg_data = 1;
}

message SendMsgResp {
  string server_msg_id = 1;
  string client_msg_id = 2;
  int64 send_time = 3;
  MsgData modify = 4;
}

// DelUserPushTokenReq is the body of websocket logout 2003.
message DelUserPushTokenReq {
  string user_id = 1;
  int32 platform_id = 2;
}

message DelUserPushTokenResp {}

message GetMaxSeqReq {
  string user_id = 1;
}

message GetMaxSeqResp {
  map<string, int64> max_seqs = 1;
  map<string, int64> min_seqs = 2;
}

message SeqRange {
  string conversation_id = 1;
  int64 begin = 2;
  int64 end = 3;
  int64 num = 4;
}

message PullMessageBySeqsReq {
  string user_id = 1;
  repeated SeqRange seq_ranges = 2;
  int32 order = 3;
}

message Seqs {
  int64 max_seq = 1;
  int64 has_read_seq = 2;
  int64 max_seq_time = 3;
}

message GetConversationsHasReadAndMaxSeqReq {
  string user_id = 1;
  repeated string conversation_ids = 2;
  bool return_pinned = 3;
}

message GetConversationsHasReadAndMaxSeqResp {
  map<string, Seqs> seqs = 1;
  repeated string pinned_conversation_ids = 2;
}

message ConversationSeqs {
  string conversation_id = 2;
  repeated int64 seqs = 3;
}

message GetSeqMessageReq {
  string user_id = 1;
  repeated ConversationSeqs conversations = 2;
  int32 order = 3;
}

message GetLastMessageReq {
  string user_id = 1;
  repeated string conversation_ids = 2;
}

message GetLastMessageResp {
  map<string, MsgData> msgs = 1;
}

message MarkMsgsAsReadReq {
  string user_id = 1;
  string conversation_id = 2;
  repeated int64 seqs = 3;
}

message MarkMsgsAsReadResp {}

message MarkConversationAsReadReq {
  string user_id = 1;
  string conversation_id = 2;
  int64 has_read_seq = 3;
  repeated int64 seqs = 4;
}

message MarkConversationAsReadResp {}

message SetConversationHasReadSeqReq {
  string user_id = 1;
  string conversation_id = 2;
  int64 has_read_seq = 3;
}

message SetConversationHasReadSeqResp {}

message GetConversationMaxSeqReq {
  string conversation_id = 1;
}

message GetConversationMaxSeqResp {
  int64 max_seq = 1;
}

message SetUserConversationMaxSeqReq {
  string conversation_id = 1;
  repeated string user_ids = 2;
  int64 max_seq = 3;
}

message SetUserConversationMaxSeqResp {}

message SetUserConversationMinSeqReq {
  string conversation_id = 1;
  repeated string user_ids = 2;
  int64 min_seq = 3;
}

message SetUserConversationMinSeqResp {}

message SetAppBackgroundStatusReq {
  string user_id = 1;
  bool is_background = 2;
}

message SubUserOnlineStatus {
  repeated string subscribe_user_id = 1;
  repeated string unsubscribe_user_id = 2;
}

message SubUserOnlineStatusElem {
  string user_id = 1;
  repeated int32 online_platform_ids = 2;
}

message SubUserOnlineStatusTips {
  repeated SubUserOnlineStatusElem subscribers = 1;
}

// CallOp is one step of a voice or video call. Media bytes are not carried here.
enum CallOp {
  CALL_OP_NONE = 0;
  CALL_INVITE = 1;
  CALL_CANCEL = 2;
  CALL_ACCEPT = 3;
  CALL_REJECT = 4;
  CALL_HANGUP = 5;
  CALL_RING = 6;
  CALL_TIMEOUT = 7;
  CALL_BUSY = 8;
  CALL_ANSWERED = 9;
}

enum CallMedia {
  CALL_MEDIA_NONE = 0;
  CALL_AUDIO = 1;
  CALL_VIDEO = 2;
}

// CallSignal is the websocket payload for frame 1004 and the push frame 2006.
// url and token are set only on CALL_ACCEPT. Each person gets their own token.
message CallSignal {
  CallOp op = 1;
  string call_id = 2;
  string peer_id = 3;
  CallMedia media = 4;
  string caller_id = 5;
  string callee_id = 6;
  string reason = 7;
  string url = 8;
  string token = 9;
}
