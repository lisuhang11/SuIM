apiVersion: v1
kind: Secret
metadata:
  name: suim-secret
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
type: Opaque
# Replace every CHANGE_ME before applying. Values are injected by config.Load
# through the SUIMENV_* variables declared on each Deployment.
stringData:
  mysql-password: CHANGE_ME
  redis-password: CHANGE_ME
  jwt-secret: CHANGE_ME
  sms-pepper: CHANGE_ME
  minio-accesskey: CHANGE_ME
  minio-secretkey: CHANGE_ME
  livekit-secret: CHANGE_ME
  getui-mastersecret: ""
  jpush-mastersecret: ""
