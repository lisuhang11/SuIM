# Message Gateway 服务配置文件
ws_addr: ":9001"
grpc_addr: ":9091"
metrics_addr: ":9092"
service_addr: "127.0.0.1:9091"
jwt_secret: "change-me-in-production"
etcd_endpoints:
  - "127.0.0.1:2379"
max_conn_per_user: 10
ping_interval: "30s"
read_timeout: "60s"
write_timeout: "10s"
graceful_shutdown_timeout: "30s"
redis_addr: "127.0.0.1:6379"
redis_password: ""
redis_db: 0
