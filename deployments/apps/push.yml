apiVersion: apps/v1
kind: Deployment
metadata:
  name: push
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: push
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: suim
      app.kubernetes.io/component: push
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suim
        app.kubernetes.io/component: push
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "16088"
    spec:
      containers:
        - name: push
          image: suim/push:dev
          imagePullPolicy: IfNotPresent
          args: ["-c", "services/push/etc/push.yaml"]
          env:
            - name: CONFIG_PATH
              value: /config
            - name: SUIMENV_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: suim-secret, key: redis-password } }
            - name: SUIMENV_PUSH_GETUI_MASTERSECRET
              valueFrom: { secretKeyRef: { name: suim-secret, key: getui-mastersecret }, optional: true }
          ports:
            - { name: grpc, containerPort: 10180 }
            - { name: metrics, containerPort: 16088 }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: suim-config }
---
apiVersion: v1
kind: Service
metadata:
  name: push
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: push
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: push
  ports:
    - { name: grpc, port: 10180, targetPort: grpc }
    - { name: metrics, port: 16088, targetPort: metrics }
