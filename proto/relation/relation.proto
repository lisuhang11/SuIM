syntax = "proto3";

package relation;

option go_package = "github.com/lisuhang11/SuIM/proto/relationpb";

// RelationService manages friend relationships and blocks between users.
service RelationService {
  // Friend request operations
  rpc SendFriendRequest(SendFriendRequestReq) returns (SendFriendRequestResp);
  rpc RespondFriendApply(RespondFriendApplyReq) returns (RespondFriendApplyResp);

  rpc DeleteFriend(DeleteFriendReq) returns (DeleteFriendResp);
  rpc UpdateFriend(UpdateFriendReq) returns (UpdateFriendResp);

  // Block management
  rpc BlockUser(BlockUserReq) returns (BlockUserResp);
  rpc UnblockUser(UnblockUserReq) returns (UnblockUserResp);

  rpc IsFriend(IsFriendReq) returns (IsFriendResp);
  rpc IsBlack(IsBlackReq) returns (IsBlackResp);

  rpc GetIncrementalFriends(GetIncrementalFriendsReq) returns (GetIncrementalFriendsResp);
  rpc GetIncrementalBlacks(GetIncrementalBlacksReq) returns (GetIncrementalBlacksResp);

  // Paged friend and black profiles. Full ID lists are separate so a client can skip the IDs when id_hash matches.
  rpc GetFriendList(GetFriendListReq) returns (GetFriendListResp);
  rpc GetFullFriendUserIDs(GetFullFriendUserIDsReq) returns (GetFullFriendUserIDsResp);
  rpc GetBlackList(GetBlackListReq) returns (GetBlackListResp);
}

// --------------- FriendRequestInfo ---------------
// status: 0 = pending, 1 = accepted, -1 = rejected
message FriendRequestInfo {
  string from_user_id = 1;
  string to_user_id   = 2;
  string message      = 3;
  string handle_msg   = 4;
  int32  status       = 5;
  int64  created_at   = 6;
  int64  updated_at   = 7;
}

// --------------- SendFriendRequest ---------------
message SendFriendRequestReq {
  string from_user_id = 1;
  string to_user_id   = 2;
  string message      = 3;
}

message SendFriendRequestResp {}

// --------------- RespondFriendApply ---------------
// Accept or reject a friend request. handle_result: 1 = accepted, -1 = rejected.
message RespondFriendApplyReq {
  string from_user_id  = 1; // sender of the friend request
  string to_user_id    = 2; // receiver of the friend request (must equal the current user)
  int32  handle_result = 3; // 1 = accept, -1 = reject
  string handle_msg    = 4;
}

message RespondFriendApplyResp {}


message DeleteFriendReq {
  string user_id   = 1;
  string friend_id = 2;
}

message DeleteFriendResp {}

message UpdateFriendReq {
  string owner_user_id  = 1;
  string friend_user_id = 2;
  optional string remark    = 3;
  optional bool   is_pinned = 4;
}

message UpdateFriendResp {}



// --------------- BlockUser ---------------
message BlockUserReq {
  string user_id         = 1;
  string blocked_user_id = 2;
}

message BlockUserResp {}

// --------------- UnblockUser ---------------
message UnblockUserReq {
  string user_id         = 1;
  string blocked_user_id = 2;
}

message UnblockUserResp {}


// --------------- IsFriend ---------------
message IsFriendReq {
  string user1 = 1;
  string user2 = 2;
}

message IsFriendResp {
  bool in_user1_friends = 1; // user2 is in user1's friend list
  bool in_user2_friends = 2; // user1 is in user2's friend list
}

// --------------- IsBlack ---------------
message IsBlackReq {
  string user1 = 1;
  string user2 = 2;
}

message IsBlackResp {
  bool in_user1_blacklist = 1; // user1 has blocked user2
  bool in_user2_blacklist = 2; // user2 has blocked user1
}


// --------------- incremental sync ---------------
// version 0 or an unknown version_id asks for a full snapshot.
// Otherwise the response carries logs newer than version.
// Friend sort changes use sort_version. A pin change bumps it.

message PublicUserInfo {
  string user_id    = 1;
  string nickname   = 2;
  string avatar_url = 3;
}

message FriendInfo {
  string         owner_user_id    = 1;
  string         remark           = 2;
  int64          create_time      = 3;
  PublicUserInfo friend_user      = 4;
  int32          add_source       = 5;
  string         operator_user_id = 6;
  bool           is_pinned        = 7;
}

message BlackInfo {
  string         owner_user_id    = 1;
  int64          create_time      = 2;
  PublicUserInfo black_user       = 3;
  int32          add_source       = 4;
  string         operator_user_id = 5;
}

message GetIncrementalFriendsReq {
  string user_id    = 1;
  string version_id = 2;
  uint64 version    = 3;
}

message GetIncrementalFriendsResp {
  uint64              version      = 1;
  string              version_id   = 2;
  bool                full         = 3;
  repeated string     delete       = 4;
  repeated FriendInfo insert       = 5;
  repeated FriendInfo update       = 6;
  uint64              sort_version = 7;
}

message GetIncrementalBlacksReq {
  string user_id    = 1;
  string version_id = 2;
  uint64 version    = 3;
}

message GetIncrementalBlacksResp {
  uint64             version    = 1;
  string             version_id = 2;
  bool               full       = 3;
  repeated string    delete     = 4;
  repeated BlackInfo insert     = 5;
  repeated BlackInfo update     = 6;
}

// --------------- paged profiles and full ID lists ---------------
// offset is zero-based. limit 0 means 20, and limit cannot exceed 200.
// id_hash is the hash of the client's ordered ID list. equal means that list is unchanged and user_ids is empty.

message GetFriendListReq {
  string user_id = 1;
  int32  offset  = 2;
  int32  limit   = 3;
}

message GetFriendListResp {
  repeated FriendInfo friends = 1;
  int32               total   = 2;
}

message GetFullFriendUserIDsReq {
  string user_id = 1;
  uint64 id_hash = 2;
}

message GetFullFriendUserIDsResp {
  uint64          version    = 1;
  string          version_id = 2;
  bool            equal      = 3;
  repeated string user_ids   = 4;
}

message GetBlackListReq {
  string user_id = 1;
  int32  offset  = 2;
  int32  limit   = 3;
}

message GetBlackListResp {
  repeated BlackInfo blacks = 1;
  int32              total  = 2;
}
