syntax = "proto3";

package user;

option go_package = "github.com/lisuhang11/SuIM/proto/userpb";

// UserService provides account registration and a single JWT session per platform.
// Success and failure are conveyed by gRPC status. Response messages carry business data only.
service UserService {
  rpc Register(RegisterReq) returns (RegisterResp);
  rpc Login(LoginReq) returns (LoginResp);
  rpc GetUserByID(GetUserByIDReq) returns (GetUserByIDResp);
  rpc GetUsersByIDs(GetUsersByIDsReq) returns (GetUsersByIDsResp);
  rpc SearchUsers(SearchUsersReq) returns (SearchUsersResp);
  rpc UpdateUser(UpdateUserReq) returns (UpdateUserResp);
  rpc DeleteUser(DeleteUserReq) returns (DeleteUserResp);
  rpc ChangePassword(ChangePasswordReq) returns (ChangePasswordResp);
  rpc ValidateToken(ValidateTokenReq) returns (ValidateTokenResp);
  rpc Logout(LogoutReq) returns (LogoutResp);
}

// UserInfo is the public profile. RegisterReq.username is stored as nickname.
// birth_time is Unix milliseconds. gender is 0 unknown, 1 male, 2 female.
message UserInfo {
  string user_id = 1;
  string email = 2;
  string nickname = 3;
  string avatar_url = 4;
  int32 app_manger_level = 5;
  int32 global_recv_msg_opt = 6;
  bool is_active = 7;
  int64 create_time = 8;
  string area_code = 9;
  string phone_number = 10;
  string account = 11;
  int32 gender = 12;
  int64 birth_time = 13;
  int32 level = 14;
  int32 allow_vibration = 15;
  int32 allow_beep = 16;
  int32 allow_add_friend = 17;
  int32 register_type = 18;
  string ex = 19;
}

message RegisterReq {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResp {
  UserInfo user = 1;
}

message LoginReq {
  string email = 1;
  string password = 2;
  int32 platform_id = 3;
}

message LoginResp {
  UserInfo user = 1;
  string token = 2;
  int64 expire_time_seconds = 3;
}

message GetUserByIDReq {
  string user_id = 1;
}

message GetUserByIDResp {
  UserInfo user = 1;
}

// --------------- GetUsersByIDs ---------------
message GetUsersByIDsReq {
  repeated string user_ids = 1;
}

message GetUsersByIDsResp {
  map<string, UserInfo> users = 1;
}

// SearchUsers matches an exact user_id. Email, account, and phone are not searched.
message SearchUsersReq {
  string keyword = 1;
}

message SearchUsersResp {
  repeated UserInfo users = 1;
}

// UpdateUserReq 是部分更新。未设置的 optional 字段保持原值。
// birth_time 为 Unix 毫秒，0 表示清空生日。
message UpdateUserReq {
  string user_id = 1;
  optional string nickname = 2;
  optional string avatar_url = 3;
  optional int32 app_manger_level = 4;
  optional int32 global_recv_msg_opt = 5;
  optional bool is_active = 6;
  optional string area_code = 7;
  optional string phone_number = 8;
  optional string account = 9;
  optional int32 gender = 10;
  optional int64 birth_time = 11;
  optional int32 level = 12;
  optional int32 allow_vibration = 13;
  optional int32 allow_beep = 14;
  optional int32 allow_add_friend = 15;
  optional int32 register_type = 16;
  optional string ex = 17;
}

message UpdateUserResp {}

// --------------- DeleteUser ---------------
message DeleteUserReq {
  string user_id = 1;
}

message DeleteUserResp {}

// --------------- ChangePassword ---------------
message ChangePasswordReq {
  string user_id      = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResp {}

message ValidateTokenReq {
  string token = 1;
}

message ValidateTokenResp {
  bool valid = 1;
  UserInfo user = 2;
  int32 platform_id = 3;
}

message LogoutReq {
  string token = 1;
}

message LogoutResp {}
