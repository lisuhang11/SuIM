apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: apigateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: suim
      app.kubernetes.io/component: apigateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suim
        app.kubernetes.io/component: apigateway
    spec:
      containers:
        - name: apigateway
          image: suim/apigateway:dev
          imagePullPolicy: IfNotPresent
          args: ["-c", "services/apigateway/etc/apigateway.yaml"]
          env:
            - name: CONFIG_PATH
              value: /config
            - name: SUIMENV_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: suim-secret, key: mysql-password } }
            - name: SUIMENV_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: suim-secret, key: redis-password } }
            - name: SUIMENV_JWT_SECRET
              valueFrom: { secretKeyRef: { name: suim-secret, key: jwt-secret } }
          ports:
            - { name: http, containerPort: 8089 }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: suim-config }
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: apigateway
spec:
  selector:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: apigateway
  ports:
    - { name: http, port: 8089, targetPort: http }
