apiVersion: apps/v1
kind: Deployment
metadata:
  name: msg
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: msg
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: suim
      app.kubernetes.io/component: msg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suim
        app.kubernetes.io/component: msg
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "16085"
    spec:
      containers:
        - name: msg
          image: suim/msg:dev
          imagePullPolicy: IfNotPresent
          args: ["-c", "services/msg/etc/msg.yaml"]
          env:
            - name: CONFIG_PATH
              value: /config
            - name: SUIMENV_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: suim-secret, key: mysql-password } }
            - name: SUIMENV_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: suim-secret, key: redis-password } }
          ports:
            - { name: grpc, containerPort: 8086 }
            - { name: metrics, containerPort: 16085 }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: suim-config }
---
apiVersion: v1
kind: Service
metadata:
  name: msg
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: msg
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: msg
  ports:
    - { name: grpc, port: 8086, targetPort: grpc }
    - { name: metrics, port: 16085, targetPort: metrics }
