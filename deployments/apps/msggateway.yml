apiVersion: apps/v1
kind: Deployment
metadata:
  name: msggateway
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: msggateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: suim
      app.kubernetes.io/component: msggateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suim
        app.kubernetes.io/component: msggateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "16086"
    spec:
      containers:
        - name: msggateway
          image: suim/msggateway:dev
          imagePullPolicy: IfNotPresent
          args: ["-c", "services/msggateway/etc/msggateway.yaml"]
          env:
            - name: CONFIG_PATH
              value: /config
            - name: SUIMENV_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: suim-secret, key: redis-password } }
          ports:
            - { name: grpc, containerPort: 8085 }
            - { name: ws, containerPort: 10001 }
            - { name: metrics, containerPort: 16086 }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: suim-config }
---
apiVersion: v1
kind: Service
metadata:
  name: msggateway
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: msggateway
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: msggateway
  ports:
    - { name: grpc, port: 8085, targetPort: grpc }
    - { name: metrics, port: 16086, targetPort: metrics }
---
apiVersion: v1
kind: Service
metadata:
  name: msggateway-ws
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: msggateway
spec:
  selector:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: msggateway
  ports:
    - { name: ws, port: 10001, targetPort: ws }
    - { name: metrics, port: 16086, targetPort: metrics }
