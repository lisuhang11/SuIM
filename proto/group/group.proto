syntax = "proto3";

package group;

option go_package = "github.com/lisuhang11/SuIM/proto/group;grouppb";

service GroupService {
  // Group lifecycle
  rpc CreateGroup(CreateGroupReq) returns (CreateGroupResp);
  rpc DismissGroup(DismissGroupReq) returns (DismissGroupResp);
  rpc TransferGroupOwner(TransferGroupOwnerReq) returns (TransferGroupOwnerResp);
  rpc UpdateGroupInfo(UpdateGroupInfoReq) returns (UpdateGroupInfoResp);
  rpc GetGroupsInfo(GetGroupsInfoReq) returns (GetGroupsInfoResp);

  // Members
  rpc InviteUserToGroup(InviteUserToGroupReq) returns (InviteUserToGroupResp);
  rpc KickGroupMember(KickGroupMemberReq) returns (KickGroupMemberResp);
  rpc QuitGroup(QuitGroupReq) returns (QuitGroupResp);
  rpc JoinGroup(JoinGroupReq) returns (JoinGroupResp);
  rpc GroupApplicationResponse(GroupApplicationResponseReq) returns (GroupApplicationResponseResp);
  rpc GetGroupApplicationList(GetGroupApplicationListReq) returns (GetGroupApplicationListResp);
  rpc GetUserReqApplicationList(GetUserReqApplicationListReq) returns (GetUserReqApplicationListResp);
  rpc SetGroupMemberInfo(SetGroupMemberInfoReq) returns (SetGroupMemberInfoResp);
  rpc MuteGroupMember(MuteGroupMemberReq) returns (MuteGroupMemberResp);
  rpc CancelMuteGroupMember(CancelMuteGroupMemberReq) returns (CancelMuteGroupMemberResp);
  rpc MuteGroup(MuteGroupReq) returns (MuteGroupResp);
  rpc CancelMuteGroup(CancelMuteGroupReq) returns (CancelMuteGroupResp);
  // 消息服务发群消息前读取群状态和这一名成员，用来判断禁言。
  rpc GetGroupMember(GetGroupMemberReq) returns (GetGroupMemberResp);
  rpc GetGroupMembers(GetGroupMembersReq) returns (GetGroupMembersResp);
  rpc GetGroupMemberUserIDs(GetGroupMemberUserIDsReq) returns (GetGroupMemberUserIDsResp);
  rpc GetJoinedGroups(GetJoinedGroupsReq) returns (GetJoinedGroupsResp);

  // Incremental sync. full=true carries no profiles; the client pages GetJoinedGroups or GetGroupMembers, then fetches IDs.
  rpc GetIncrementalJoinGroups(GetIncrementalJoinGroupsReq) returns (GetIncrementalJoinGroupsResp);
  rpc GetFullJoinGroupIDs(GetFullJoinGroupIDsReq) returns (GetFullJoinGroupIDsResp);
  rpc GetIncrementalGroupMembers(GetIncrementalGroupMembersReq) returns (GetIncrementalGroupMembersResp);
  rpc BatchGetIncrementalGroupMembers(BatchGetIncrementalGroupMembersReq) returns (BatchGetIncrementalGroupMembersResp);
  rpc GetFullGroupMemberUserIDs(GetFullGroupMemberUserIDsReq) returns (GetFullGroupMemberUserIDsResp);
}


// --------------- GroupInfo ---------------
message GroupInfo {
  string group_id = 1;
  string group_name = 2;
  string notification = 3;
  string introduction = 4;
  string face_url = 5;
  int64  create_time = 6;
  string ex = 7;
  int32  status = 8;             // 0正常 2已解散 3全员禁言
  string creator_user_id = 9;
  int32  group_type = 10;       // 1普通群 2超级群
  int32  need_verification = 11; // 加群是否需要验证
  int32  look_member_info = 12;  // 是否允许查看成员信息
  int32  apply_member_friend = 13; // 是否允许成员互加好友
  int64  notification_update_time = 14;
  string notification_user_id = 15;
  // 对齐 OpenIM：不落 group 表，读时由 group_member 聚合填充。
  int32  member_count = 16;
  // 对齐 OpenIM ownerUserID：当前群主，读时由 role=owner 的成员填充（可与 creator 不同）。
  string owner_user_id = 17;
}

// --------------- GroupMemberFullInfo ---------------
message GroupMemberFullInfo {
  string group_id = 1;
  string user_id = 2;
  string nickname = 3;
  string face_url = 4;
  int32  role_level = 5;         // 100群主 60管理员 20普通成员
  int64  join_time = 6;
  int32  join_source = 7;
  string inviter_user_id = 8;
  string operator_user_id = 9;
  int64  mute_end_time = 10;     // 0=未禁言
  string ex = 11;
}

// --------------- GroupRequestInfo ---------------
message GroupRequestInfo {
  string user_id = 1;
  string group_id = 2;
  int32  handle_result = 3;      // 0未处理 1同意 -1拒绝
  string req_msg = 4;
  string handled_msg = 5;
  int64  req_time = 6;
  string handle_user_id = 7;
  int64  handled_time = 8;
  int32  join_source = 9;
  string inviter_user_id = 10;
  string ex = 11;
}

// --------------- CreateGroup ---------------
message CreateGroupReq {
  string creator_user_id = 1;
  string group_name = 2;
  string notification = 3;
  string introduction = 4;
  string face_url = 5;
  int32  group_type = 6;         // 1普通群 2超级群，缺省为普通群
  int32  need_verification = 7;
  int32  look_member_info = 8;
  int32  apply_member_friend = 9;
  repeated string member_ids = 10; // 初始成员(由创建者邀请)
  string ex = 11;
}
message CreateGroupResp {
  string group_id = 1;
  GroupInfo group = 2;
}

// --------------- DismissGroup ---------------
message DismissGroupReq {
  string group_id = 1;
  string op_user_id = 2; // 必须为群主
}
message DismissGroupResp {}

// --------------- TransferGroupOwner ---------------
message TransferGroupOwnerReq {
  string group_id = 1;
  string op_user_id = 2;          // 当前群主
  string new_owner_user_id = 3;
}
message TransferGroupOwnerResp {}

// --------------- UpdateGroupInfo ---------------
message UpdateGroupInfoReq {
  string group_id = 1;
  string op_user_id = 2;          // deprecated: 服务端使用认证上下文中的用户
  optional string group_name = 3;
  optional string notification = 4;
  optional string introduction = 5;
  optional string face_url = 6;
  optional int32  need_verification = 7;
  optional int32  look_member_info = 8;
  optional int32  apply_member_friend = 9;
  optional string ex = 10;
}
message UpdateGroupInfoResp {
  GroupInfo group = 1;
}

// --------------- GetGroupsInfo ---------------
message GetGroupsInfoReq {
  repeated string group_ids = 1;
}
message GetGroupsInfoResp {
  repeated GroupInfo groups = 1;
}

// --------------- InviteUserToGroup ---------------
message InviteUserToGroupReq {
  string group_id = 1;
  string op_user_id = 2;          // 群主/管理员
  repeated string user_ids = 3;
  string reason = 4;
}
message InviteUserToGroupResp {}

// --------------- KickGroupMember ---------------
message KickGroupMemberReq {
  string group_id = 1;
  string op_user_id = 2;          // 群主/管理员
  string user_id = 3;             // 被踢成员
}
message KickGroupMemberResp {}

// --------------- QuitGroup ---------------
message QuitGroupReq {
  string group_id = 1;
  string user_id = 2;             // 退群者(不能是群主)
}
message QuitGroupResp {}

// --------------- JoinGroup ---------------
// user_id 是申请人。need_verification 为 2 时直接入群，0 和 1 只写入申请。
message JoinGroupReq {
  string group_id = 1;
  string user_id = 2;
  string req_msg = 3;
  int32 join_source = 4;          // 1管理员 2邀请 3搜索 4二维码
  string ex = 5;
}
message JoinGroupResp {}

// --------------- GroupApplicationResponse ---------------
// op_user_id 必须是群主或管理员。from_user_id 是申请人。handle_result 为 1 同意、-1 拒绝。
message GroupApplicationResponseReq {
  string group_id = 1;
  string op_user_id = 2;
  string from_user_id = 3;
  string handled_msg = 4;
  int32 handle_result = 5;
}
message GroupApplicationResponseResp {}

// --------------- GetGroupApplicationList ---------------
// 群主或管理员查看自己管理的群的入群申请。group_ids 为空时查全部管理中的群。
message GetGroupApplicationListReq {
  string from_user_id = 1;
  repeated string group_ids = 2;
  repeated int32 handle_results = 3; // 空表示全部，0未处理 1同意 -1拒绝
  int32 offset = 4;
  int32 limit = 5;
}
message GetGroupApplicationListResp {
  repeated GroupRequestInfo requests = 1;
  int32 total = 2;
}

// --------------- GetUserReqApplicationList ---------------
message GetUserReqApplicationListReq {
  string user_id = 1;
  repeated string group_ids = 2;
  repeated int32 handle_results = 3;
  int32 offset = 4;
  int32 limit = 5;
}
message GetUserReqApplicationListResp {
  repeated GroupRequestInfo requests = 1;
  int32 total = 2;
}

// --------------- SetGroupMemberInfo ---------------
// 未传的字段不修改。role_level 只能是 60 管理员或 20 普通成员。
message SetGroupMemberInfo {
  string group_id = 1;
  string user_id = 2;
  optional string nickname = 3;
  optional string face_url = 4;
  optional int32 role_level = 5;
  optional string ex = 6;
}
message SetGroupMemberInfoReq {
  string op_user_id = 1;
  repeated SetGroupMemberInfo members = 2;
}
message SetGroupMemberInfoResp {}

// --------------- Mute ---------------
message MuteGroupMemberReq {
  string group_id = 1;
  string op_user_id = 2;
  string user_id = 3;
  uint32 muted_seconds = 4;
}

message MuteGroupMemberResp {}

message CancelMuteGroupMemberReq {
  string group_id = 1;
  string op_user_id = 2;
  string user_id = 3;
}

message CancelMuteGroupMemberResp {}

message MuteGroupReq {
  string group_id = 1;
  string op_user_id = 2;
}

message MuteGroupResp {}

message CancelMuteGroupReq {
  string group_id = 1;
  string op_user_id = 2;
}

message CancelMuteGroupResp {}

message GetGroupMemberReq {
  string group_id = 1;
  string user_id = 2;
}

message GetGroupMemberResp {
  GroupInfo group = 1;
  GroupMemberFullInfo member = 2;
}

// --------------- GetGroupMembers ---------------
message GetGroupMembersReq {
  string group_id = 1;
  int32 offset = 2;
  int32 limit = 3;
}
message GetGroupMembersResp {
  repeated GroupMemberFullInfo members = 1;
  int32 total = 2;
}

// --------------- GetGroupMemberUserIDs ----------
message GetGroupMemberUserIDsReq {
  string group_id = 1;
}
message GetGroupMemberUserIDsResp {
  repeated string user_ids = 1;
}

// --------------- GetJoinedGroups ---------------
message GetJoinedGroupsReq {
  string user_id = 1;
  int32 offset = 2;
  int32 limit = 3;
}
message GetJoinedGroupsResp {
  repeated GroupInfo groups = 1;
  int32 total = 2;
}

// --------------- incremental join groups ---------------
// version 0 or an unknown version_id returns full=true and empty insert/update/delete.
message GetIncrementalJoinGroupsReq {
  string user_id = 1;
  string version_id = 2;
  uint64 version = 3;
}
message GetIncrementalJoinGroupsResp {
  uint64 version = 1;
  string version_id = 2;
  bool full = 3;
  repeated string delete = 4;
  repeated GroupInfo insert = 5;
  repeated GroupInfo update = 6;
}

// id_hash is the hash of the client's ordered group ID list.
// equal=true means the list is unchanged and group_ids is empty.
message GetFullJoinGroupIDsReq {
  string user_id = 1;
  uint64 id_hash = 2;
}
message GetFullJoinGroupIDsResp {
  uint64 version = 1;
  string version_id = 2;
  bool equal = 3;
  repeated string group_ids = 4;
}

// --------------- incremental group members ---------------
// user_id is the caller and must already be a member.
// An empty element id in the version log means the group profile changed.
message GetIncrementalGroupMembersReq {
  string group_id = 1;
  string user_id = 2;
  string version_id = 3;
  uint64 version = 4;
}
message GetIncrementalGroupMembersResp {
  uint64 version = 1;
  string version_id = 2;
  bool full = 3;
  repeated string delete = 4;
  repeated GroupMemberFullInfo insert = 5;
  repeated GroupMemberFullInfo update = 6;
  GroupInfo group = 7;
  uint64 sort_version = 8;
}

message BatchGetIncrementalGroupMembersReq {
  string user_id = 1;
  repeated GetIncrementalGroupMembersReq groups = 2;
}
message BatchGetIncrementalGroupMembersResp {
  map<string, GetIncrementalGroupMembersResp> groups = 1;
}

message GetFullGroupMemberUserIDsReq {
  string group_id = 1;
  uint64 id_hash = 2;
}
message GetFullGroupMemberUserIDsResp {
  uint64 version = 1;
  string version_id = 2;
  bool equal = 3;
  repeated string user_ids = 4;
}
