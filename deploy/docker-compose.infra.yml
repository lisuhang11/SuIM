# ============================================================
# SuIM - Infrastructure Docker Compose
# ============================================================
# Usage:
#   docker compose -f deploy/docker-compose.infra.yml up -d
#   docker compose -f deploy/docker-compose.infra.yml down
#
# This file starts infrastructure only (MySQL + etcd + MinIO + Redis).
# Use docker compose up -d to start all services.
# ============================================================

services:
  # ==========================================================
  # etcd v3.5 — 服务注册与发现
  # ==========================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: suim-etcd
    restart: unless-stopped
    environment:
      ETCD_NAME: suim-etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: "1"
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ==========================================================
  # MySQL 8.0
  # ==========================================================
  mysql:
    image: mysql:8.0
    container_name: suim-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-suim123}
      MYSQL_DATABASE: suim
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-suim123}" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: suim-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-suim}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-suim-file-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-10005}:9000"
      - "${MINIO_CONSOLE_PORT:-10006}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ==========================================================
  # Redis 7 — 用户资料等旁路缓存 / 临时状态
  # ==========================================================
  redis:
    image: redis:7.0-alpine
    container_name: suim-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-suim-redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-suim-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
  etcd-data:
  minio-data:
  redis-data:
