# Point the in-cluster names used by ConfigMap at infrastructure running
# outside the cluster (for example the containers from docker-compose.yaml on
# a node). Replace every EXTERNAL_IP with an address reachable from Pods.
# If you deploy MySQL/Redis/MinIO inside Kubernetes instead, delete this file
# and create normal Services with the same names and ports.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: suim
spec:
  ports:
    - { name: mysql, port: 3306, targetPort: 3306 }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mysql
  namespace: suim
subsets:
  - addresses:
      - ip: EXTERNAL_IP
    ports:
      - { port: 3306 }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: suim
spec:
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis
  namespace: suim
subsets:
  - addresses:
      - ip: EXTERNAL_IP
    ports:
      - { port: 6379 }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: suim
spec:
  ports:
    - { name: minio, port: 9000, targetPort: 9000 }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: minio
  namespace: suim
subsets:
  - addresses:
      - ip: EXTERNAL_IP
    ports:
      - { port: 9000 }
