apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtc
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: rtc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: suim
      app.kubernetes.io/component: rtc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suim
        app.kubernetes.io/component: rtc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "16089"
    spec:
      containers:
        - name: rtc
          image: suim/rtc:dev
          imagePullPolicy: IfNotPresent
          args: ["-c", "services/rtc/etc/rtc.yaml"]
          env:
            - name: CONFIG_PATH
              value: /config
            - name: SUIMENV_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: suim-secret, key: redis-password } }
            - name: SUIMENV_LIVEKIT_SECRET
              valueFrom: { secretKeyRef: { name: suim-secret, key: livekit-secret }, optional: true }
          ports:
            - { name: grpc, containerPort: 8088 }
            - { name: metrics, containerPort: 16089 }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: suim-config }
---
apiVersion: v1
kind: Service
metadata:
  name: rtc
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: rtc
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: rtc
  ports:
    - { name: grpc, port: 8088, targetPort: grpc }
    - { name: metrics, port: 16089, targetPort: metrics }
