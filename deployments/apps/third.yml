apiVersion: apps/v1
kind: Deployment
metadata:
  name: third
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: third
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: suim
      app.kubernetes.io/component: third
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suim
        app.kubernetes.io/component: third
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "16082"
    spec:
      containers:
        - name: third
          image: suim/third:dev
          imagePullPolicy: IfNotPresent
          args: ["-c", "services/third/etc/third.yaml"]
          env:
            - name: CONFIG_PATH
              value: /config
            - name: SUIMENV_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: suim-secret, key: redis-password } }
            - name: SUIMENV_MINIO_ACCESSKEY
              valueFrom: { secretKeyRef: { name: suim-secret, key: minio-accesskey } }
            - name: SUIMENV_MINIO_SECRETKEY
              valueFrom: { secretKeyRef: { name: suim-secret, key: minio-secretkey } }
          ports:
            - { name: grpc, containerPort: 8084 }
            - { name: metrics, containerPort: 16082 }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: suim-config }
---
apiVersion: v1
kind: Service
metadata:
  name: third
  namespace: suim
  labels:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: third
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: suim
    app.kubernetes.io/component: third
  ports:
    - { name: grpc, port: 8084, targetPort: grpc }
    - { name: metrics, port: 16082, targetPort: metrics }
